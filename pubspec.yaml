name: sync_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # ⭕ google_fontsを正しい位置（スペース2個）に配置しました！
  google_fonts: ^6.2.1

  # ⭕ cupertino_iconsの縦ラインもきれいに揃えました！
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  firebase_core: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ⭕ 下にあった余計な「dependencies:」を消して、綺麗に整理しました！
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ⭕ ここもバッチリ綺麗です！
  assets:
    - assets/images/